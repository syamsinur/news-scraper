[project]
name = "news-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nur Syamsi", email = "syamsinur455@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.17.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.162.5",
    "gnews>=0.8.3",
    "googlenewsdecoder>=0.2.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "python-multipart>=0.0.33",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
news-scraper = "news_scraper:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
